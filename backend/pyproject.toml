[project]
name = "api-conciliacion"
version = "0.1.0"
description = "Backend de conciliacion bancaria"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2.1",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    # Los .xls viejos (BIFF, OLE2) no los lee openpyxl: hace falta xlrd.
    # La app los acepta para no obligar a convertir a mano los extractos
    # exportados por portales viejos.
    "xlrd>=2.0.1",
    "pdfplumber>=0.11.0",
    "httpx>=0.27.0"
]

# dependency-groups (PEP 735) y no optional-dependencies: uv instala este grupo
# en cada sync, asi que "uv run pytest" funciona sin agregar --extra dev.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Para fabricar los PDF de prueba en los tests (el de muestra de Santander
    # viene incluido, pero el escaneado hay que generarlo).
    "reportlab>=4.0.0",
    # xlwt escribe .xls BIFF de verdad, que es lo que hay que probar: un .xls
    # renombrado desde .xlsx no pasa la validacion de firma.
    "xlwt>=1.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"