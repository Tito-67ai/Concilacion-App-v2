<div class="relative">
  <!-- Input oculto: lo dispara la opcion "Importar via Excel" -->
  <input id="importarExcel" #excelInput type="file" accept=".xlsx,.xls,.csv" class="hidden" (change)="elegirExcel($event)" />

  <button
    type="button"
    (click)="alternarMenu($event)"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuAbierto()"
    class="flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm text-gray-700 shadow-sm transition-colors duration-200 hover:border-gray-400 hover:bg-gray-50"
  >
    Importar
    <i
      class="pi pi-chevron-down text-[10px] transition-transform duration-200"
      [ngClass]="menuAbierto() ? 'rotate-180' : ''"
    ></i>
  </button>

  <!-- Popover de opciones -->
  <div
    *ngIf="menuAbierto()"
    role="menu"
    aria-label="Opciones de importacion"
    class="animate-aparecer-pop absolute left-0 z-50 mt-2 w-80 rounded-lg border border-gray-200 bg-white p-1.5 shadow-lg shadow-black/5"
  >
    <!-- Opcion 1: Excel -->
    <button
      type="button"
      role="menuitem"
      (click)="excelInput.click()"
      class="group flex w-full items-start gap-3 rounded-md px-3 py-2.5 text-left transition-colors duration-150 hover:bg-[#f4f6f8]"
    >
      <span
        class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-[#eaf4ec] text-[#217346] transition-transform duration-200 group-hover:scale-105"
      >
        <i class="pi pi-file-excel text-sm"></i>
      </span>
      <span class="min-w-0 flex-1">
        <span class="block text-sm font-medium text-gray-700">Importar vía Excel</span>
        <span class="block text-xs text-gray-400">Archivo .xlsx, .xls o .csv</span>
      </span>
      <i class="pi pi-angle-right mt-2 text-xs text-gray-300"></i>
    </button>

    <!-- Separador -->
    <div class="my-1.5 h-px bg-gray-100"></div>

    <!-- Opcion 2: PDF (nuevo) -->
    <button
      type="button"
      role="menuitem"
      (click)="irAImportarPdf()"
      class="group flex w-full items-start gap-3 rounded-md px-3 py-2.5 text-left transition-colors duration-150 hover:bg-[#f4f6f8]"
    >
      <span
        class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-md bg-[#fdecec] text-[#c0392b] transition-transform duration-200 group-hover:scale-105"
      >
        <i class="pi pi-file-pdf text-sm"></i>
      </span>
      <span class="min-w-0 flex-1">
        <span class="flex items-center gap-2">
          <span class="block text-sm font-medium text-gray-700">Importar vía PDF</span>
          <span
            class="rounded-full bg-[#004e82] px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-white"
          >
            Nuevo
          </span>
        </span>
        <span class="block text-xs text-gray-400">Leemos el extracto del banco por vos</span>
      </span>
      <i class="pi pi-angle-right mt-2 text-xs text-gray-300"></i>
    </button>
  </div>
</div>
